# Hardened Moodle stack
# - Moodle code and moodledata are persisted on the host
# - GHCR supplies PHP, Apache, Moodle's first-start source seed, and tools
# - PostgreSQL and Nginx Proxy Manager on EXTERNAL Docker networks
# - Valkey + Ofelia on an internal network
#
# Prerequisites (once on the host):
#   docker network create nginx-proxy-manager   # or whatever NPM uses
#   docker network create postgres-net          # or whatever Postgres uses
#   mkdir -p ./moodle ./moodledata && chown -R 33:33 ./moodle ./moodledata
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose pull && docker compose up -d

services:
  moodle:
    image: ${OTA_IMAGE:-ghcr.io/operator-training-academy/ota_moodle}:${OTA_IMAGE_TAG:-latest}
    container_name: moodle_app
    restart: unless-stopped
    environment:
      # Database (external PostgreSQL)
      DB_TYPE: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-moodle}
      DB_USER: ${DB_USER:-moodle}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PREFIX: ${DB_PREFIX:-mdl_}
      # Site
      WWWROOT: ${WWWROOT}
      SITE_FULLNAME: ${SITE_FULLNAME:-Hardened Moodle}
      SITE_SHORTNAME: ${SITE_SHORTNAME:-Moodle}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      MOODLE_PASSWORD_SALT_MAIN: ${MOODLE_PASSWORD_SALT_MAIN}
      # Cache / sessions (internal Valkey)
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PREFIX: ${REDIS_PREFIX:-moodle_}
      # Behind Nginx Proxy Manager
      REVERSE_PROXY: ${REVERSE_PROXY:-true}
      SSL_PROXY: ${SSL_PROXY:-true}
      TZ: ${TZ:-UTC}
    volumes:
      # The first start populates an empty code path from the image seed.
      - ${MOODLE_CODE_PATH:-./moodle}:/var/www/moodle
      - ${MOODLEDATA_PATH:-./moodledata}:/moodledata
    # No host ports when behind Nginx Proxy Manager.
    # Uncomment only for direct debugging:
    # ports:
    #   - "${HTTP_PORT:-8080}:80"
    depends_on:
      cache:
        condition: service_started
    networks:
      - proxy       # Nginx Proxy Manager
      - database    # external PostgreSQL
      - internal    # Valkey + Ofelia
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    # The root filesystem is read-only; the two application bind mounts are writable.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /var/run:mode=0755,size=64m
      - /var/lock:mode=1777,size=16m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  cache:
    image: valkey/valkey:8-alpine
    container_name: moodle_cache
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: moodle_ofelia
    restart: unless-stopped
    depends_on:
      - moodle
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/ofelia.ini:/etc/ofelia/config.ini:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# No named volumes. moodledata is a host bind mount for backup and portability.
# No internal Postgres — use your external database network.

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager}
  database:
    external: true
    name: ${DB_NETWORK:-postgres-net}
  internal:
    driver: bridge
    name: moodle_internal
