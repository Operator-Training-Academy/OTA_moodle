# Apache hardening, Moodle security path blocks, and plugin clean URLs
# Loaded via a2enconf moodle

# ---------------------------------------------------------------------------
# Server hardening
# ---------------------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-XSS-Protection "1; mode=block"
Header unset X-Powered-By

LimitRequestBody 134217728
LimitRequestFields 100
LimitRequestFieldSize 8190

# ---------------------------------------------------------------------------
# Document root
# ---------------------------------------------------------------------------
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    RewriteEngine On

    # -----------------------------------------------------------------------
    # 1. Security: block paths that must not be public
    #    (Moodle Site administration → Reports → Security checks)
    #    Return 404 so existence is not confirmed.
    # -----------------------------------------------------------------------

    # Composer / npm / VCS / tooling
    RewriteRule "(^|/)vendor(/|$)" - [L,R=404]
    RewriteRule "(^|/)node_modules(/|$)" - [L,R=404]
    RewriteRule "(^|/)\.(?!well-known/)" - [L,R=404]

    # Dependency / lock / test config files
    RewriteRule "(^|/)composer\.(json|lock)$" - [L,R=404]
    RewriteRule "(^|/)package(-lock)?\.json$" - [L,R=404]
    RewriteRule "(^|/)phpunit\.xml(\.dist)?$" - [L,R=404]
    RewriteRule "(^|/)behat\.yml$" - [L,R=404]
    RewriteRule "(^|/)Gruntfile\.js$" - [L,R=404]

    # Install / environment metadata
    RewriteRule "(^|/)environment\.xml$" - [L,R=404]
    RewriteRule "(^|/)install\.xml$" - [L,R=404]

    # Readmes / upgrade notes (any depth)
    # Covers readme.txt, README.md, readme_moodle.txt, moodle_readme, etc.
    RewriteRule "(?i)(^|/)(readme[^/]*|moodle_readme)(\.(txt|md))?$" - [L,R=404]
    RewriteRule "(^|/)(upgrade\.txt|UPGRADING(-CURRENT)?\.md)$" - [L,R=404]
    RewriteRule "(^|/)\.upgradenotes(/|$)" - [L,R=404]
    RewriteRule "(^|/)\.stylelintrc" - [L,R=404]

    # Internal class trees / tests / fixtures
    RewriteRule "(^|/)lib/classes(/|$)" - [L,R=404]
    RewriteRule "(^|/)tests/behat(/|$)" - [L,R=404]
    RewriteRule "(^|/)fixtures(/|$)" - [L,R=404]
    RewriteRule "(^|/)privacy/tests(/|$)" - [L,R=404]
    RewriteRule "(^|/)enrol/.+/tests(/|$)" - [L,R=404]
    RewriteRule "(^|/)blog/tests(/|$)" - [L,R=404]

    # -----------------------------------------------------------------------
    # 2. Plugin clean URLs (must come AFTER security blocks)
    # -----------------------------------------------------------------------

    # local_staticpage — https://moodle.org/plugins/local_staticpage
    # Clean URL: /static/pagename.html → local/staticpage/view.php?page=pagename
    RewriteRule ^static/(.*)\.html$ /local/staticpage/view.php?page=$1 [L,QSA]

    # local_page (Custom Page by RoseaThemes) — https://moodle.org/plugins/local_page
    # Clean URL: /about-us → /local/page/index.php?menuname=about-us
    # Only a single path segment; skip real files/dirs and known Moodle top-level paths.
    # Exclusion list includes core dirs + common subsystems (ai, reportbuilder, sms, …).
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/(admin|ai|analytics|auth|availability|backup|badges|blocks|blog|cache|calendar|cohort|comment|communication|competency|completion|contentbank|course|customfield|dataformat|enrol|error|files|filter|grade|group|h5p|install|iplookup|lang|lib|local|login|media|message|mod|my|notes|payment|pix|plagiarism|portfolio|public|question|rating|report|reportbuilder|repository|rss|search|sms|static|tag|theme|user|webservice|xapi)(/|$) [NC]
    # Do not treat *.php entry points as custom-page slugs
    RewriteCond %{REQUEST_URI} !\.php(/|$)?$ [NC]
    RewriteRule ^([a-zA-Z0-9._-]+)/?$ /local/page/index.php?menuname=$1 [L,QSA]

</Directory>

# Never serve moodledata over HTTP
<Directory /var/moodledata>
    Require all denied
</Directory>
